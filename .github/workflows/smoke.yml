name: smoke

# The regression guards for Factory 3.0 — the response envelope that could not
# express failure, probes that restamped cached verdicts, view formatters reading
# columns that do not exist, blackout rendering as GREEN. None of it ran unless
# someone remembered to type the command. The suite is pure logic, no DB and no
# network, so there was never a reason for it to be manual.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: server smoke suite
        working-directory: omatic-server-connection/server
        run: npm run check
      # There are two package.json files. CI was running the server one; the
      # plugin-root one — what a human types — did not include the suite, and
      # ended in a `--version` call that hung forever. Both run now.
      - name: plugin-root check (the one a human runs)
        working-directory: omatic-server-connection
        run: npm run check

  vendored-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: committed node_modules matches the lockfile
        run: node scripts/verify-vendored-deps.mjs

  # Change-log item 22 / task #342: THE CHECKS EXISTED AND NOTHING RAN THEM.
  #
  # audit-installed-skill-duplicates, version-align and the two sync scripts
  # were all written, all working, and all manual. Measured live: one role at
  # three versions across three manifest sources; another in three copies
  # differing on disk; two shared skills whose frontmatter `name` did not match
  # their parent directory — a SILENT load failure on VS Code. Every one of
  # those was detectable by a script sitting in this repo.
  #
  # A check that only runs when someone remembers is not a control. These two
  # are pure file comparison — no DB, no network, no host state — so there was
  # never a reason for them to be manual.
  skill-sameness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # sync-shared-skills resolves sibling repos by directory NAME relative
          # to the workspace root, so the checkout must land in a directory
          # actually called o-matic-marketplace. Checked out anywhere else it
          # reports every consumer MISSING and passes on an empty set — a
          # vacuous pass, which is the failure class this job exists to catch.
          path: o-matic-marketplace
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: shared skill fragments match canonical
        working-directory: o-matic-marketplace
        run: node scripts/sync-shared-skills.mjs --check
      # sync-bundled-skills.mjs is DELIBERATELY NOT RUN HERE. It resolves against
      # ~/.codex/skills and ~/.codex/plugins/cache — HOST STATE. On a clean runner
      # there is no ~/.codex, so all four skills report "install: missing (not
      # installed)" and it exits 1 on every push, forever, for a reason that has
      # nothing to do with drift.
      #
      # It was wired in at 5.4.0 and removed here at the Pass 2 Smith gate, which
      # caught it by running the job under a fake HOME. audit-installed-skill-
      # duplicates.mjs was correctly excluded for exactly this reason in the same
      # commit that added this one — the same defect, judged two different ways in
      # one file. A permanently red job is the failure that change-log item 22
      # exists to close, not a stricter version of closing it.
      #
      # To run it against a real machine it needs a host-side hook, or a mode that
      # audits the repo instead of the installed caches. Task #366.
      - name: root agent-pack.json matches canonical
        working-directory: o-matic-marketplace
        run: node scripts/verify-agent-pack.mjs
      # Task #310. A SKILL.md whose frontmatter `name` disagrees with its parent
      # directory is SILENTLY ABSENT on VS Code — no error, no warning, the skill
      # just is not there. Two of four .agents skills shipped that way and it was
      # found by hand, not by anything running.
      - name: skill frontmatter name matches its directory
        working-directory: o-matic-marketplace
        run: node scripts/verify-skill-names.mjs
      # Task #379. Finder collision artifacts — "factory 2.js" beside
      # "factory.js" — are a second definition the loader cannot tell from the
      # first. 864 were found by hand in the plugins tree during #317. Two were
      # real: a STALE VARIANT of server/factory.js (~16 diff lines, so which one
      # loaded depended on the import path someone typed), and a
      # smoke-startup-modes 2.mjs with NO live original that imported the module
      # 5.0.0 deleted. Nothing in the release path looked.
      #
      # The script guards its own vacuous pass twice: it fails if it scanned
      # zero files, AND if it did not descend into the directories that matter.
      # It skips node_modules by DIRECTORY NAME, never by path substring — a
      # `grep -v node_modules` swallows the whole tree the moment the checkout
      # lands under a path containing the word, which on a runner is not ours to
      # choose. Mutation-tested against a planted artifact before wiring.
      - name: no Finder collision artifacts in the source tree
        working-directory: o-matic-marketplace
        run: node scripts/verify-no-collision-artifacts.mjs
      # Guard against the vacuous pass directly: if the check reports nothing at
      # all, the job has proved nothing. Assert it actually examined consumers.
      # The guard asserts an EXACT count, not "at least one". A >= 1 threshold
      # against nine real consumers means eight entries can be deleted from the
      # SHARED/FRAGMENTS arrays and this still passes green — which is precisely
      # how a drift check gets quietly neutered. Raised from >= 1 to == EXPECTED
      # at the Pass 2 Smith gate.
      #
      # When you legitimately add or remove a consumer, this fails and you update
      # the number in the same commit. That is the point: changing the size of the
      # checked population should require saying so.
      - name: the check examined the expected consumer set
        working-directory: o-matic-marketplace
        env:
          EXPECTED_CONSUMERS: "11"
        run: |
          n=$(node scripts/sync-shared-skills.mjs --check 2>&1 | grep -c '^ok:' || true)
          echo "consumers verified in sync: $n (expected $EXPECTED_CONSUMERS)"
          if [ "$n" -ne "$EXPECTED_CONSUMERS" ]; then
            echo "::error::sync-shared-skills examined $n consumers, expected $EXPECTED_CONSUMERS. If you added or removed one, update EXPECTED_CONSUMERS in this workflow in the same commit."
            exit 1
          fi
