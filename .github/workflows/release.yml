name: release

# State-reconciliation release. On every push to the default branch (main), for each
# plugin whose canonical catalog version has no matching immutable tag, cut
# <plugin>-vX.Y.Z and publish a GitHub Release. Idempotent: already-released versions
# are a no-op. The release job will NOT run unless the rule #287 verify job passes,
# so no tag is ever cut off a drifted tree (Smith #3).
#
# TRIGGER RETARGETED 2026-08-15. This fired on `stable`, which decision #323 DELETED when the
# branch model collapsed to a single long-lived `main`. The workflow was not updated with it, so
# seven consecutive version bumps (5.2.0 through 5.8.0) pushed to a branch this file did not
# watch: no tag was cut, no Release was published, and nothing noticed because verify-versions
# stayed green and green read as shipped. A version number moving is not a release.
#
# Never cuts the marketplace-wide
# vX.Y.Z milestone — that stays manual (decision #177).

on:
  push:
    branches: ["main"]

permissions:
  contents: write   # create/push tags and publish releases

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch --tags --force
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify rule #287 alignment
        run: node scripts/version-align.mjs

      # EVERY GATE, NOT JUST THE VERSION ONE. Added at the Pass 2 re-gate.
      #
      # This job previously ran version-align alone, and `release` needs only
      # this job. smoke and skill-sameness live in smoke.yml with no relationship
      # to the release path, and there is no branch protection requiring them
      # (docs/COMPLIANCE.md control 1). GitHub Actions cannot express a cross-
      # workflow `needs:`, so the checks are duplicated here deliberately.
      #
      # This is not hypothetical. The run history shows `smoke` FAILURE and
      # `verify-versions` SUCCESS on the same commit for three consecutive
      # pushes (5.6.0, 5.7.0, 5.8.0). Had release.yml been pointed at `main`
      # during that window it would have cut three tags and published three
      # Releases off a tree whose sameness gate was red. Fixing the trigger
      # removed the reason nothing shipped; it did not add the reason a bad
      # tree cannot ship. This does.
      - name: Skills match canonical
        run: node scripts/sync-shared-skills.mjs --check
      - name: Skill frontmatter name matches its directory
        run: node scripts/verify-skill-names.mjs
      - name: Root agent-pack.json matches canonical
        run: node scripts/verify-agent-pack.mjs
      - name: Vendored deps match the lockfile
        run: node scripts/verify-vendored-deps.mjs -f
      - name: Plugin smoke suite
        working-directory: omatic-server-connection
        run: npm run check

  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch --tags --force
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Configure git identity
        run: |
          git config user.name "o-matic-release-bot"
          git config user.email "info@o-matic.ai"
      - name: Reconcile releases (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-reconcile.mjs --write
